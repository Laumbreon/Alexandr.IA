<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatec Botucatu - Redefinir senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/fatec.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <header class="brand">
                <div class="brand-logo">FATEC</div>
                <div class="brand-city">Botucatu</div>
                <p class="brand-inst">Faculdade de Tecnologia de Botucatu<br>Centro Paula Souza</p>
            </header>

            <form id="form-reset-senha">
                <div class="welcome-message">
                    <h2>Redefinir senha</h2>
                    <p>Digite sua nova senha</p>
                </div>

                <input type="hidden" id="token" value="">

                <div class="form-group">
                    <label for="nova_senha">Nova senha</label>
                    <input type="password" id="nova_senha" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="confirmar_senha">Confirmar senha</label>
                    <input type="password" id="confirmar_senha" placeholder="Confirme sua nova senha" autocomplete="new-password" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="login-btn">Redefinir senha</button>
                </div>
            </form>

            <div id="mensagem" class="mensagem-escondida"></div>
            <a href="/login" class="voltar-btn">← Voltar ao login</a>
        </div>
    </div>

    <script src="/static/senha-nova.js"></script>
</body>
</html>
