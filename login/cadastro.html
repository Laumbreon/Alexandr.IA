<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatec Botucatu - Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/fatec.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <header class="brand">
                <div class="brand-logo">FATEC</div>
                <div class="brand-city">Botucatu</div>
                <p class="brand-inst">Faculdade de Tecnologia de Botucatu<br>Centro Paula Souza</p>
            </header>

            <div class="welcome-message">
                <h2>Cadastre-se</h2>
                <p>Crie sua conta para acessar a plataforma</p>
            </div>

            <form id="cadastroForm">
                <div class="form-group">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" placeholder="Insira seu nome completo" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu.nome@aluno.cps.sp.gov.br" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="De 15 a 128 caracteres" autocomplete="new-password" minlength="15" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="login-btn">Cadastrar</button>
                    <a href="/login" class="esqueci-btn">Já tem conta? Entrar</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/cadastro.js"></script>
</body>
</html>
