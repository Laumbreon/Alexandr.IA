<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatec Botucatu - Recuperar senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/fatec.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <header class="brand">
                <div class="brand-logo">FATEC</div>
                <div class="brand-city">Botucatu</div>
                <p class="brand-inst">Faculdade de Tecnologia de Botucatu<br>Centro Paula Souza</p>
            </header>

            <form id="form-esqueci-senha">
                <div class="welcome-message">
                    <h2>Esqueceu sua senha?</h2>
                    <p>Digite seu e-mail e enviaremos um link para redefinir.</p>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu.nome@aluno.cps.sp.gov.br" autocomplete="email" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="login-btn">Enviar link</button>
                </div>
            </form>

            <div id="mensagem" class="mensagem-escondida"></div>
            <a href="/login" class="voltar-btn">← Voltar ao login</a>
        </div>
    </div>

    <script src="/static/recuperar.js"></script>
</body>
</html>
